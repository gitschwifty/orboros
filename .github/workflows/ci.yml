name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run parallel-safe tests
        run: >-
          cargo test --workspace --locked
          --
          --skip supervisor::tests::local_socket_serves_typed_supervisor_requests
          --skip supervisor::tests::local_socket_client_surfaces_typed_responses
          --skip supervisor::tests::store_writer_serializes_orb_updates_through_the_supervisor

      - name: Run Unix-socket supervisor tests serially
        run: |
          cargo test --workspace --locked supervisor::tests::local_socket_serves_typed_supervisor_requests -- --test-threads=1
          cargo test --workspace --locked supervisor::tests::local_socket_client_surfaces_typed_responses -- --test-threads=1
          cargo test --workspace --locked supervisor::tests::store_writer_serializes_orb_updates_through_the_supervisor -- --test-threads=1
