# Orboros execution policy. Secrets belong in the environment, never here.
# Precedence: built-in defaults < ~/.orboros/config.toml < this file < explicit CLI flags.
# Set provider credentials such as OPENROUTER_API_KEY in the environment, not this file.
config_version = 1
default_model = "openrouter/free"
max_concurrency = 4
# worker_binary = "/absolute/path/to/heddle-headless"
# HEDDLE_BINARY is also accepted as an invocation-level worker-binary override.

[models]
# Set true to let decomposition coordinators choose from named catalog options
# for individual generated child tasks. Disabled by default.
coordinator_model_choice = false

[models.default]
# worker = "balanced"
# coordinator = "balanced"
# chat = "balanced"

# Named models are optional; selectors above may also be raw provider/model strings.
[models.options.balanced]
model = "openrouter/free"
description = "Replace with this project's default worker model."
router = "openrouter"

[bench]
# timeout_s = 600
# max_iterations = 20
# jobs = 1

[review]
requires_approval_by_default = false
review_on_completion = true

[notification]
enabled = true
desktop_enabled = false

[logging]
# level = "orboros=info,heddle=warn"
# file = "/absolute/path/to/orboros.log"

[workers]
# Retry attempts after the first failure. 0 disables retries; -1 retries
# retryable failures with capped exponential backoff until the process stops.
retries = 1

[heddle]
# Absolute path to a Heddle headless config file. Project values override global.
# config_path = "/Users/you/.orboros/heddle-config.toml"

[refinement]
# The default preserves the historical single structured refinement pass.
max_rounds = 1
stop_on_no_material_change = true
stop_on_model_complete = true

[daemon]
# pid_file = "/absolute/path/to/orboros.pid"
# log_file = "/absolute/path/to/orboros.log"
# log_max_size = 10485760
# tick_interval_ms = 1000
# Optional aggregate cap across every project supervised by one daemon.
# global_max_concurrency = 8

# Tool profiles are allowlists. An empty allowed_tools array explicitly grants no tools.
[tool_profiles.read_only]
allowed_tools = ["read_file", "glob", "grep"]

[tool_profiles.research]
allowed_tools = ["read_file", "glob", "grep", "web_fetch", "write_file"]

[tool_profiles.test]
allowed_tools = ["read_file", "glob", "grep", "bash"]

[tool_profiles.edit]
allowed_tools = ["read_file", "write_file", "edit_file", "glob", "grep", "bash"]

[tool_profiles.execute]
allowed_tools = ["read_file", "write_file", "edit_file", "glob", "grep", "bash"]
